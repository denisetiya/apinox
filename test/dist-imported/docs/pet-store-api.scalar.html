<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Store API — API Reference</title>
  <style>
    /* Dark theme base */
    body {
      margin: 0;
      padding: 0;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    html {
      background: #0d1117;
    }
    /* Scalar overrides for dark mode */
    .scalar-api-reference {
      --scalar-color-1: #e6edf3;
      --scalar-color-2: #8b949e;
      --scalar-color-3: #58a6ff;
      --scalar-sidebar-background: #161b22;
      --scalar-sidebar-border-color: #30363d;
      --scalar-customer-theme: dark;
    }
  </style>
</head>
<body>
  <div id="scalar-api-reference"></div>

  <script id="api-reference" type="application/json">
{
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "scheme": "bearer",
        "type": "http"
      }
    }
  },
  "info": {
    "description": "A sample pet store API",
    "title": "Pet Store API",
    "version": "1.0.0"
  },
  "openapi": "3.1.0",
  "paths": {
    "/pets": {
      "get": {
        "operationId": "get-pets",
        "parameters": [
          {
            "in": "query",
            "name": "limit",
            "required": false,
            "schema": {
              "type": "integer"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "properties": {},
                  "type": "object"
                }
              }
            },
            "description": "A list of pets"
          }
        },
        "summary": "List all pets",
        "tags": [
          "pets"
        ]
      },
      "post": {
        "operationId": "post-pets",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "properties": {
                  "breed": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": [
                  "name"
                ],
                "type": "object"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Pet created"
          }
        },
        "summary": "Create a pet",
        "tags": [
          "pets"
        ]
      }
    }
  },
  "servers": [
    {
      "description": "Production",
      "url": "https://petstore.example.com/v1"
    }
  ]
}
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>
