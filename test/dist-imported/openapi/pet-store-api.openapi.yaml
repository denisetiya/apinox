openapi: 3.1.0
info:
  title: Pet Store API
  version: 1.0.0
  description: A sample pet store API
servers:
- url: https://petstore.example.com/v1
  description: Production
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /pets:
    get:
      operationId: get-pets
      summary: List all pets
      tags:
      - pets
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: object
                properties: {}
    post:
      operationId: post-pets
      summary: Create a pet
      tags:
      - pets
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                breed:
                  type: string
                name:
                  type: string
              required:
              - name
      responses:
        '201':
          description: Pet created
