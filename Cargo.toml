[package]
name = "apinox"
version = "0.1.0"
edition = "2021"
description = "Schema-first API documentation generator"
authors = ["Apinox"]
license = "MIT"

[[bin]]
name = "apinox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
similar = "2"
glob = "0.3"
notify = "6"
ureq = { version = "3", default-features = false, features = ["json", "_tls"] }
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
